[package]
name = "trimsec"
description = "Plan your content intake."
authors = ["Anindya Shiddhartha <shiddhartha@tuta.io>"]
version = "2.8.0"
edition = "2024"
repository = "https://github.com/hitblast/trimsec"
homepage = "https://github.com/hitblast/trimsec"
license = "MIT"
readme = "README.md"
exclude = ["assets/*"]

[[bin]]
name = "ts"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "6.0.0"
supports-color = "3.0.2"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
url = "2.5.8"

[dev-dependencies]
clap_complete = "4.6.11"
pretty_assertions = "1.4.1"

[workspace]
members = [".", "xtask"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
must_use_candidate = "warn"

[lints.rust]
unused_must_use = "deny"

[profile.release]
lto = "thin"
